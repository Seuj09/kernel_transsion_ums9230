name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ upstream-302, master ]

jobs:
  build:
    # Pinned to 22.04 on purpose: its apt clang is 14.  ubuntu-latest (24.04)
    # ships clang 18, where -Wint-conversion is an error by default and a 5.4
    # tree no longer builds cleanly.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves clang lld llvm

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -1

      - name: Show kernel release
        run: |
          make ARCH=arm64 O=out bg6_defconfig >/dev/null
          echo "kernelrelease: $(make ARCH=arm64 O=out -s kernelrelease)"

      - name: Build Image
        run: |
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out -j$(nproc) Image

      - name: Compress Image with xz -9e
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz
          ls -lh out/arch/arm64/boot/Image out/arch/arm64/boot/Image.xz

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image.xz
          if-no-files-found: warn
